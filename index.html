<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN DMS - 發文管理系統</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "glam-dark": "#050505",
                        "glam-card": "#121212",
                        "glam-gold": {
                            100: "#FBF5D4",
                            200: "#F3E5AB",
                            300: "#E3C580",
                            400: "#D4AF37",
                            500: "#B4941F",
                            600: "#8A6E28",
                            900: "#3E2F0A",
                        },
                    },
                    fontFamily: {
                        sans: ["'Noto Sans TC'", "sans-serif"],
                        serif: ["'Playfair Display'", "serif"],
                        display: ["'Cinzel'", "serif"],
                    },
                    backgroundImage: {
                        'luxury-gradient': 'radial-gradient(circle at 50% 0%, #2a2a2a 0%, #050505 100%)',
                        'gold-shimmer': 'linear-gradient(45deg, rgba(212, 175, 55, 0) 40%, rgba(212, 175, 55, 0.2) 50%, rgba(212, 175, 55, 0) 60%)',
                        'gold-plate': 'linear-gradient(180deg, #F3E5AB 0%, #D4AF37 40%, #B4941F 100%)',
                        'dark-plate': 'linear-gradient(180deg, #2D2D2D 0%, #121212 100%)',
                    },
                    boxShadow: {
                        'gold-glow': '0 0 20px rgba(212, 175, 55, 0.15)',
                        'card-emboss': 'inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 20px rgba(0,0,0,0.5)',
                        'inner-glow': 'inset 0 0 20px rgba(212, 175, 55, 0.05)',
                    },
                    animation: {
                        'shimmer': 'shimmer 3s infinite linear',
                        'fadeIn': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                },
            },
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #050505;
            min-height: max(884px, 100dvh);
        }
        .text-gold-gradient {
            background: linear-gradient(to bottom, #F3E5AB, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .border-gold-gradient {
            border-image: linear-gradient(to bottom, #D4AF37, #8A6E28) 1;
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-glam-dark bg-luxury-gradient text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-glam-gold-400 selection:text-black">
    
    <!-- 背景裝飾 -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-glam-gold-400/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-blue-900/10 rounded-full blur-[120px]"></div>
        <div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-glam-gold-400/5 rounded-full blur-[80px]"></div>
    </div>

    <!-- Header -->
    <header class="pt-14 pb-6 px-5 sticky top-0 z-30 glass-panel border-b border-white/5 transition-all duration-300">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
                <div class="relative group">
                    <div class="absolute -inset-1 bg-gradient-to-r from-glam-gold-300 to-glam-gold-600 rounded-full blur opacity-40 group-hover:opacity-75 transition duration-1000"></div>
                    <div class="relative w-12 h-12 rounded-full bg-gradient-to-b from-[#333] to-[#111] border border-glam-gold-500/30 flex items-center justify-center shadow-lg">
                        <span class="material-icons-round text-glam-gold-200 text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]">article</span>
                    </div>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide font-display text-gold-gradient drop-shadow-sm">GOLDEN DMS</h1>
                    <div class="flex items-center gap-2">
                        <span class="h-[1px] w-4 bg-glam-gold-500/50"></span>
                        <p class="text-[10px] text-glam-gold-300/70 uppercase tracking-[0.25em] font-serif">發文管理系統</p>
                    </div>
                </div>
            </div>
            <button onclick="showStats()" class="relative w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group overflow-hidden">
                <div class="absolute inset-0 bg-glam-gold-400/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                <span class="material-icons-round text-glam-gold-200 group-hover:text-white transition-colors">bar_chart</span>
            </button>
        </div>
        
        <!-- 搜尋框 -->
        <div class="relative group mt-2">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-glam-gold-600 via-glam-gold-300 to-glam-gold-600 rounded-xl opacity-30 group-focus-within:opacity-100 transition duration-500 blur-sm"></div>
            <div class="relative flex items-center bg-[#0F0F0F] rounded-xl border border-white/10 group-focus-within:border-glam-gold-400/50 shadow-inner transition-all">
                <span class="pl-4 flex items-center pointer-events-none">
                    <span class="material-icons-round text-glam-gold-500/70 group-focus-within:text-glam-gold-300 transition-colors">search</span>
                </span>
                <input id="searchInput" class="block w-full pl-3 pr-4 py-3 bg-transparent border-none text-glam-gold-100 placeholder-white/20 focus:ring-0 text-sm tracking-wide font-light" placeholder="搜尋文號、主旨、受文者..." type="text" oninput="filterDocuments()"/>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-4 py-6 overflow-y-auto pb-32 relative z-10" id="mainContent">
        
        <!-- 篩選按鈕 -->
        <div class="flex gap-3 mb-8 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="setFilter('all')" id="filter-all" class="flex-shrink-0 px-4 py-2 bg-gradient-to-r from-glam-gold-500 to-glam-gold-700 text-black font-bold text-xs rounded-lg shadow-[0_4px_12px_rgba(212,175,55,0.3)] border border-glam-gold-300/50 flex items-center gap-1">
                <span class="material-icons-round text-sm">filter_list</span>
                <span>全部文件</span>
            </button>
            <button onclick="setFilter('temp')" id="filter-temp" class="flex-shrink-0 px-4 py-2 bg-white/5 text-glam-gold-200 border border-white/10 hover:border-glam-gold-500/50 rounded-lg text-xs font-medium tracking-wide transition-all hover:bg-white/10">
                臨時號碼 (<span id="tempCount">0</span>)
            </button>
            <button onclick="setFilter('complete')" id="filter-complete" class="flex-shrink-0 px-4 py-2 bg-white/5 text-gray-400 border border-white/10 hover:border-glam-gold-500/50 rounded-lg text-xs font-medium tracking-wide transition-all hover:bg-white/10">
                已完成
            </button>
        </div>

        <!-- 統計卡片 (隱藏) -->
        <div id="statsPanel" class="hidden mb-6 grid grid-cols-2 gap-3 animate-fadeIn">
            <div class="bg-[#161616] rounded-xl p-4 border border-white/5 shadow-card-emboss">
                <div class="text-3xl font-bold text-gold-gradient mb-1" id="totalCountDisplay">0</div>
                <div class="text-xs text-white/40 uppercase tracking-wider">總文號數</div>
            </div>
            <div class="bg-[#161616] rounded-xl p-4 border border-white/5 shadow-card-emboss">
                <div class="text-3xl font-bold text-green-400 mb-1" id="completeCountDisplay">0</div>
                <div class="text-xs text-white/40 uppercase tracking-wider">已完成</div>
            </div>
            <div class="bg-[#161616] rounded-xl p-4 border border-white/5 shadow-card-emboss">
                <div class="text-3xl font-bold text-glam-gold-400 mb-1" id="tempCountDisplay">0</div>
                <div class="text-xs text-white/40 uppercase tracking-wider">臨時號碼</div>
            </div>
            <div class="bg-[#161616] rounded-xl p-4 border border-white/5 shadow-card-emboss">
                <div class="text-3xl font-bold text-blue-400 mb-1" id="todayCountDisplay">0</div>
                <div class="text-xs text-white/40 uppercase tracking-wider">今日新增</div>
            </div>
        </div>

        <!-- 文件列表標題 -->
        <div class="flex items-center justify-between mb-6 px-1">
            <h2 class="text-xl font-display text-white flex items-center gap-3">
                <span class="material-icons-round text-glam-gold-400 text-lg">stars</span>
                <span class="text-gold-gradient font-bold tracking-wider">文件列表</span>
            </h2>
            <span class="text-[10px] font-serif italic text-white/30 border-b border-white/10 pb-0.5">Royal Edition</span>
        </div>

        <!-- 文件列表 -->
        <div id="docList" class="space-y-6">
            <!-- 文件卡片將在這裡動態生成 -->
        </div>

        <!-- 空狀態 -->
        <div id="emptyState" class="hidden text-center py-20">
            <span class="material-icons-round text-6xl text-white/10 mb-4">inbox</span>
            <p class="text-white/30 text-sm font-serif">目前沒有文號資料</p>
        </div>
    </main>

    <!-- 底部導航 -->
    <nav class="fixed bottom-0 w-full glass-panel border-t border-white/10 z-40 pb-safe shadow-[0_-5px_20px_rgba(0,0,0,0.5)]">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-[1px] bg-gradient-to-r from-transparent via-glam-gold-400 to-transparent shadow-[0_0_10px_#D4AF37]"></div>
        <div class="flex justify-around items-center h-16 px-2">
            <button onclick="switchPage('manage')" id="nav-manage" class="flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-500 hover:text-glam-gold-200 transition-colors group">
                <span class="material-icons-round text-2xl group-hover:scale-110 transition-transform duration-300">assignment</span>
                <span class="text-[9px] font-medium tracking-widest uppercase">管理</span>
            </button>
            <button onclick="switchPage('add')" id="nav-add" class="relative -top-5">
                <div class="absolute inset-0 bg-glam-gold-400/20 blur-xl rounded-full"></div>
                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-glam-gold-300 to-glam-gold-600 flex items-center justify-center shadow-[0_4px_10px_rgba(212,175,55,0.4)] border border-glam-gold-200/50 relative z-10">
                    <span class="material-icons-round text-3xl text-black drop-shadow-sm">add_circle</span>
                </div>
                <span class="absolute -bottom-4 left-1/2 -translate-x-1/2 text-[9px] font-bold text-glam-gold-300 tracking-widest uppercase whitespace-nowrap">新增</span>
            </button>
            <button onclick="switchPage('settings')" id="nav-settings" class="flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-500 hover:text-glam-gold-200 transition-colors group">
                <span class="material-icons-round text-2xl group-hover:scale-110 transition-transform duration-300">settings</span>
                <span class="text-[9px] font-medium tracking-widest uppercase">設定</span>
            </button>
        </div>
    </nav>

    <!-- 新增文號 Modal -->
    <div id="addModal" class="hidden fixed inset-0 z-50 overflow-y-auto modal-overlay">
        <div class="flex min-h-full items-end justify-center p-4">
            <div class="relative w-full max-w-lg transform transition-all animate-fadeIn">
                <div class="bg-[#121212] rounded-t-3xl border border-white/10 shadow-2xl">
                    <!-- Modal Header -->
                    <div class="bg-gradient-to-r from-glam-gold-900/40 to-transparent px-6 py-4 border-b border-white/5 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="material-icons-round text-glam-gold-400">add_circle</span>
                            <h3 class="text-lg font-display text-gold-gradient font-bold tracking-wider">新增發文字號</h3>
                        </div>
                        <button onclick="closeAddModal()" class="text-white/50 hover:text-white transition-colors">
                            <span class="material-icons-round">close</span>
                        </button>
                    </div>

                    <!-- Modal Body -->
                    <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                        <!-- 公司選擇模式切換 -->
                        <div class="flex gap-2">
                            <button onclick="switchInputModeModal('select')" id="toggle-select" class="flex-1 py-2 px-4 bg-gradient-to-r from-glam-gold-500 to-glam-gold-700 text-black font-bold text-xs rounded-lg border border-glam-gold-300/50">
                                選擇公司
                            </button>
                            <button onclick="switchInputModeModal('custom')" id="toggle-custom" class="flex-1 py-2 px-4 bg-white/5 text-glam-gold-200 border border-white/10 rounded-lg text-xs font-medium">
                                自訂代碼
                            </button>
                        </div>

                        <!-- 選擇模式 -->
                        <div id="selectModeModal">
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">公司名稱</label>
                            <select id="companySelectModal" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all">
                                <option value="">請選擇公司</option>
                            </select>
                        </div>

                        <!-- 自訂模式 -->
                        <div id="customModeModal" class="hidden">
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">公司代碼（自訂）</label>
                            <input type="text" id="customCompanyCodeModal" placeholder="例如：昊陽" maxlength="10" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all placeholder-white/20">
                        </div>

                        <!-- 部門代碼 -->
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">部門代碼</label>
                            <select id="deptCodeModal" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all" required>
                                <option value="">請選擇部門</option>
                            </select>
                        </div>

                        <!-- 發文日期 -->
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">發文日期</label>
                            <input type="date" id="docDateModal" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all" required>
                            <p class="text-[10px] text-white/30 mt-2">💡 此日期將影響文號的日期部分</p>
                        </div>

                        <!-- 主旨 -->
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">主旨</label>
                            <input type="text" id="subjectModal" placeholder="請輸入文件主旨" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all placeholder-white/20">
                        </div>

                        <!-- 受文者 -->
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">受文者</label>
                            <input type="text" id="recipientModal" placeholder="請輸入受文者" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all placeholder-white/20">
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <div class="p-6 pt-0 grid grid-cols-2 gap-3">
                        <button onclick="generateTempNumberModal()" class="py-3 bg-white/5 hover:bg-white/10 text-glam-gold-200 border border-white/10 hover:border-glam-gold-500/30 rounded-lg text-sm font-bold tracking-wide transition-all flex items-center justify-center gap-2">
                            <span class="material-icons-round text-sm">schedule</span>
                            <span>臨時號碼</span>
                        </button>
                        <button onclick="submitDocModal()" class="relative overflow-hidden group/btn rounded-lg">
                            <div class="absolute inset-0 bg-gold-plate"></div>
                            <div class="absolute inset-0 bg-white/20 opacity-0 group-hover/btn:opacity-100 transition-opacity"></div>
                            <div class="relative py-3 flex items-center justify-center gap-2 text-black font-bold text-sm tracking-wide">
                                <span class="material-icons-round text-sm">check_circle</span>
                                <span>完整建檔</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 編輯 Modal -->
    <div id="editModal" class="hidden fixed inset-0 z-50 overflow-y-auto modal-overlay">
        <div class="flex min-h-full items-end justify-center p-4">
            <div class="relative w-full max-w-lg transform transition-all animate-fadeIn">
                <div class="bg-[#121212] rounded-t-3xl border border-white/10 shadow-2xl">
                    <div class="bg-gradient-to-r from-glam-gold-900/40 to-transparent px-6 py-4 border-b border-white/5 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="material-icons-round text-glam-gold-400">edit</span>
                            <h3 class="text-lg font-display text-gold-gradient font-bold tracking-wider">編輯文號</h3>
                        </div>
                        <button onclick="closeEditModal()" class="text-white/50 hover:text-white transition-colors">
                            <span class="material-icons-round">close</span>
                        </button>
                    </div>
                    <div class="p-6 space-y-4">
                        <input type="hidden" id="editDocId">
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">主旨</label>
                            <input type="text" id="editSubject" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs text-glam-gold-300 mb-2 font-bold tracking-wider uppercase">受文者</label>
                            <input type="text" id="editRecipient" class="w-full px-4 py-3 bg-[#0F0F0F] border border-white/10 rounded-lg text-white text-sm focus:border-glam-gold-500/50 focus:ring-0 transition-all">
                        </div>
                    </div>
                    <div class="p-6 pt-0 grid grid-cols-2 gap-3">
                        <button onclick="closeEditModal()" class="py-3 bg-white/5 hover:bg-white/10 text-gray-400 border border-white/10 rounded-lg text-sm font-medium transition-all">
                            取消
                        </button>
                        <button onclick="submitEdit()" class="relative overflow-hidden group/btn rounded-lg">
                            <div class="absolute inset-0 bg-gold-plate"></div>
                            <div class="relative py-3 text-black font-bold text-sm tracking-wide">儲存</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定頁面 Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 overflow-y-auto modal-overlay">
        <div class="flex min-h-full items-end justify-center p-4">
            <div class="relative w-full max-w-lg transform transition-all animate-fadeIn">
                <div class="bg-[#121212] rounded-t-3xl border border-white/10 shadow-2xl">
                    <div class="bg-gradient-to-r from-glam-gold-900/40 to-transparent px-6 py-4 border-b border-white/5 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="material-icons-round text-glam-gold-400">settings</span>
                            <h3 class="text-lg font-display text-gold-gradient font-bold tracking-wider">系統設定</h3>
                        </div>
                        <button onclick="closeSettingsModal()" class="text-white/50 hover:text-white transition-colors">
                            <span class="material-icons-round">close</span>
                        </button>
                    </div>
                    <div class="p-6 space-y-6">
                        <div>
                            <h4 class="text-sm font-bold text-glam-gold-300 mb-4 uppercase tracking-wider">資料管理</h4>
                            <div class="space-y-3">
                                <button onclick="exportToCSV()" class="w-full py-3 bg-white/5 hover:bg-white/10 text-glam-gold-200 border border-white/10 hover:border-glam-gold-500/30 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
                                    <span class="material-icons-round text-sm">download</span>
                                    <span>匯出 CSV 檔案</span>
                                </button>
                                <button onclick="confirmClearAll()" class="w-full py-3 bg-red-900/10 hover:bg-red-900/20 text-red-400 border border-red-500/20 hover:border-red-500/40 rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
                                    <span class="material-icons-round text-sm">delete_forever</span>
                                    <span>清空所有資料</span>
                                </button>
                            </div>
                        </div>
                        <div class="bg-[#0F0F0F] rounded-xl p-4 border border-white/5">
                            <h4 class="text-sm font-bold text-glam-gold-300 mb-3 uppercase tracking-wider">關於系統</h4>
                            <div class="space-y-2 text-xs text-white/50">
                                <p><span class="text-glam-gold-400">系統版本：</span>V1.1 Golden Edition</p>
                                <p><span class="text-glam-gold-400">更新內容：</span>黑金奢華風格、日期選擇</p>
                                <p><span class="text-glam-gold-400">儲存方式：</span>瀏覽器本地儲存</p>
                                <p class="text-[10px] text-white/30 mt-3">所有資料儲存在您的裝置上，不會上傳至伺服器</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-fadeIn">
        <div class="bg-[#1a1a1a] border border-glam-gold-500/30 rounded-xl px-6 py-3 shadow-2xl flex items-center gap-3">

            { code: "嘉算", name: "嘉義算力科技股份有限公司" }
        ];

        const DEPARTMENTS = [
            { code: "稽核", name: "稽核室" },
            { code: "總執", name: "總經理室" },
            { code: "法務", name: "法務室" },
            { code: "財處", name: "財務處" },
            { code: "財務", name: "財務部" },
            { code: "會計", name: "會計部" },
            { code: "總管處", name: "總管理處" },
            { code: "人資", name: "人資部" },
            { code: "管理", name: "管理部" },
            { code: "資訊", name: "資訊部" },
            { code: "質管", name: "品質管理部" },
            { code: "採處", name: "採購處" },
            { code: "採購", name: "採購部" },
            { code: "倉管", name: "倉管部" },
            { code: "工管處", name: "工程管理處" },
            { code: "工程", name: "工程部" },
            { code: "維運", name: "維運部" },
            { code: "設規處", name: "設計規劃處" },
            { code: "設規", name: "設計規劃部" },
            { code: "開發處", name: "事業開發暨專案管理處" },
            { code: "業務", name: "業務部" },
            { code: "新事業", name: "新產品事業部" }
        ];

        let documents = [];
        let currentFilter = 'all';
        let currentInputMode = 'select';

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            initializeSelects();
            setDefaultDate();
            loadDocuments();
            updateStats();
            renderDocuments();
        });

        function initializeSelects() {
            const companySelect = document.getElementById('companySelectModal');
            const deptSelect = document.getElementById('deptCodeModal');

            COMPANIES.forEach(company => {
                companySelect.innerHTML += `<option value="${company.code}">${company.name}</option>`;
            });

            DEPARTMENTS.forEach(dept => {
                deptSelect.innerHTML += `<option value="${dept.code}">${dept.name} (${dept.code})</option>`;
            });
        }

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('docDateModal').value = today;
        }

        // ========== 頁面切換 ==========
        function switchPage(page) {
            if (page === 'add') {
                document.getElementById('addModal').classList.remove('hidden');
            } else if (page === 'settings') {
                document.getElementById('settingsModal').classList.remove('hidden');
            } else if (page === 'manage') {
                // 已經在管理頁面，不需要做什麼
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        // ========== 輸入模式切換 ==========
        function switchInputModeModal(mode) {
            currentInputMode = mode;
            const selectMode = document.getElementById('selectModeModal');
            const customMode = document.getElementById('customModeModal');
            const btnSelect = document.getElementById('toggle-select');
            const btnCustom = document.getElementById('toggle-custom');

            if (mode === 'select') {
                selectMode.classList.remove('hidden');
                customMode.classList.add('hidden');
                btnSelect.className = 'flex-1 py-2 px-4 bg-gradient-to-r from-glam-gold-500 to-glam-gold-700 text-black font-bold text-xs rounded-lg border border-glam-gold-300/50';
                btnCustom.className = 'flex-1 py-2 px-4 bg-white/5 text-glam-gold-200 border border-white/10 rounded-lg text-xs font-medium';
            } else {
                selectMode.classList.add('hidden');
                customMode.classList.remove('hidden');
                btnSelect.className = 'flex-1 py-2 px-4 bg-white/5 text-glam-gold-200 border border-white/10 rounded-lg text-xs font-medium';
                btnCustom.className = 'flex-1 py-2 px-4 bg-gradient-to-r from-glam-gold-500 to-glam-gold-700 text-black font-bold text-xs rounded-lg border border-glam-gold-300/50';
            }
        }

        // ========== 文號生成 ==========
        function generateDocNumber(isTemp = false) {
            const dateInput = document.getElementById('docDateModal').value;
            if (!dateInput) {
                showToast('請選擇發文日期', 'warning');
                return null;
            }
            
            const selectedDate = new Date(dateInput);
            const rocYear = selectedDate.getFullYear() - 1911;
            const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const day = String(selectedDate.getDate()).padStart(2, '0');

            let companyCode;
            if (currentInputMode === 'select') {
                companyCode = document.getElementById('companySelectModal').value;
            } else {
                companyCode = document.getElementById('customCompanyCodeModal').value.trim();
            }

            const deptCode = document.getElementById('deptCodeModal').value;

            if (!companyCode || !deptCode) {
                showToast('請選擇公司和部門', 'warning');
                return null;
            }

            const currentDateStr = `${rocYear}${month}${day}`;
            const sameDayDocs = documents.filter(doc => {
                const docDate = doc.docNumber.match(/第(\d{7})/);
                if (!docDate) return false;
                const docDateStr = docDate[1];
                return doc.companyCode === companyCode && 
                       doc.deptCode === deptCode && 
                       docDateStr === currentDateStr;
            });

            const serial = String(sameDayDocs.length + 1).padStart(4, '0');
            const docNumber = `${companyCode}${deptCode}字第${rocYear}${month}${day}${serial}號`;

            return {
                docNumber,
                companyCode,
                deptCode,
                date: selectedDate.toISOString(),
                status: isTemp ? 'temp' : 'complete'
            };
        }

        // ========== 臨時號碼 ==========
        function generateTempNumberModal() {
            const docInfo = generateDocNumber(true);
            if (!docInfo) return;

            const newDoc = {
                id: Date.now(),
                ...docInfo,
                subject: '',
                recipient: ''
            };

            documents.unshift(newDoc);
            saveDocuments();
            renderDocuments();
            updateStats();
            closeAddModal();
            showToast(`✨ 已產生臨時號碼：${docInfo.docNumber}`);
        }

        // ========== 完整建檔 ==========
        function submitDocModal() {
            const docInfo = generateDocNumber(false);
            if (!docInfo) return;

            const subject = document.getElementById('subjectModal').value.trim();
            const recipient = document.getElementById('recipientModal').value.trim();

            const newDoc = {
                id: Date.now(),
                ...docInfo,
                subject,
                recipient
            };

            documents.unshift(newDoc);
            saveDocuments();
            renderDocuments();
            updateStats();
            closeAddModal();
            showToast(`✅ 已建立文號：${docInfo.docNumber}`);

            // 清空表單
            document.getElementById('subjectModal').value = '';
            document.getElementById('recipientModal').value = '';
        }

        // ========== 編輯文件 ==========
        function editDocument(id) {
            const doc = documents.find(d => d.id === id);
            if (!doc) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('editSubject').value = doc.subject || '';
            document.getElementById('editRecipient').value = doc.recipient || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function submitEdit() {
            const id = parseInt(document.getElementById('editDocId').value);
            const subject = document.getElementById('editSubject').value.trim();
            const recipient = document.getElementById('editRecipient').value.trim();

            const doc = documents.find(d => d.id === id);
            if (!doc) return;

            doc.subject = subject;
            doc.recipient = recipient;
            doc.status = 'complete';

            saveDocuments();
            renderDocuments();
            updateStats();
            closeEditModal();
            showToast('✅ 已更新文號資料');
        }

        // ========== 刪除文件 ==========
        function deleteDocument(id) {
            if (!confirm('確定要刪除這個文號嗎？')) return;

            documents = documents.filter(d => d.id !== id);
            saveDocuments();
            renderDocuments();
            updateStats();
            showToast('🗑️ 已刪除文號');
        }

        // ========== 完成建檔 ==========
        function completeDocument(id) {
            editDocument(id);
        }

        // ========== 渲染文件列表 ==========
        function renderDocuments() {
            const docList = document.getElementById('docList');
            const emptyState = document.getElementById('emptyState');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = documents.filter(doc => {
                const matchSearch = !searchTerm || 
                    doc.docNumber.toLowerCase().includes(searchTerm) ||
                    (doc.subject && doc.subject.toLowerCase().includes(searchTerm)) ||
                    (doc.recipient && doc.recipient.toLowerCase().includes(searchTerm));
                
                const matchFilter = currentFilter === 'all' || doc.status === currentFilter;

                return matchSearch && matchFilter;
            });

            if (filtered.length === 0) {
                docList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            docList.innerHTML = filtered.map(doc => {
                const date = new Date(doc.date);
                const formattedDate = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
                
                const isTemp = doc.status === 'temp';
                const companyName = COMPANIES.find(c => c.code === doc.companyCode)?.name || doc.companyCode;

                return `
                    <article class="group relative transition-all duration-300 transform hover:-translate-y-1">
                        <div class="absolute -inset-[1px] bg-gradient-to-b from-glam-gold-300 via-glam-gold-600 to-transparent rounded-2xl opacity-60 group-hover:opacity-100 blur-[2px] transition-opacity duration-500"></div>
                        <div class="relative bg-[#161616] rounded-2xl p-0 overflow-hidden shadow-card-emboss border border-white/5">
                            <div class="absolute inset-0 bg-gradient-to-br from-white/5 via-transparent to-black/40 pointer-events-none"></div>
                            <div class="absolute right-0 top-0 w-32 h-32 bg-glam-gold-500/10 blur-[50px] rounded-full"></div>
                            
                            <div class="bg-gradient-to-r from-glam-gold-900/40 to-transparent px-5 py-3 border-b border-white/5 flex justify-between items-center relative">
                                <div class="flex items-center gap-2">
                                    ${isTemp ? `
                                        <div class="w-1.5 h-1.5 rounded-full bg-glam-gold-400 shadow-[0_0_8px_#D4AF37]"></div>
                                        <span class="text-[10px] font-display font-bold tracking-[0.2em] text-glam-gold-300 uppercase">Priority High</span>
                                    ` : `
                                        <div class="w-1.5 h-1.5 rounded-full bg-green-400 shadow-[0_0_8px_#22c55e]"></div>
                                        <span class="text-[10px] font-display font-bold tracking-[0.2em] text-green-300 uppercase">Completed</span>
                                    `}
                                </div>
                                <span class="text-[10px] font-serif italic text-white/40">${formattedDate}</span>
                            </div>

                            <div class="p-5 pt-4 relative">
                                <div class="mb-4">
                                    <!-- 金色發光框文號 -->
                                    <div class="inline-block px-4 py-2 mb-3 bg-gradient-to-r from-glam-gold-900/40 to-glam-gold-700/40 border-2 border-glam-gold-400/80 rounded-lg shadow-[0_0_20px_rgba(212,175,55,0.5)]">
                                        <span class="block text-base font-bold tracking-wider text-glam-gold-200 font-mono drop-shadow-[0_2px_8px_rgba(212,175,55,0.8)]">${doc.docNumber}</span>
                                    </div>
                                    <h3 class="text-sm font-serif text-white/70 leading-tight tracking-wide">
                                        ${companyName}
                                    </h3>
                                    ${doc.subject ? `<p class="text-sm text-white/60 mt-2 font-light">📝 ${doc.subject}</p>` : ''}
                                    ${doc.recipient ? `<p class="text-sm text-white/60 mt-1 font-light">👤 ${doc.recipient}</p>` : ''}
                                </div>

                                <div class="flex flex-wrap gap-2 mb-6">
                                    <span class="inline-flex items-center px-3 py-1 rounded-sm border ${isTemp ? 'border-glam-gold-500/30 bg-glam-gold-500/10 text-glam-gold-300' : 'border-green-500/30 bg-green-500/10 text-green-300'} text-[10px] font-bold uppercase tracking-wider backdrop-blur-sm">
                                        <span class="material-icons-round text-[10px] mr-1">${isTemp ? 'bolt' : 'check_circle'}</span> 
                                        ${isTemp ? '臨時' : '已完成'}
                                    </span>
                                </div>

                                <div class="grid ${isTemp ? 'grid-cols-4' : 'grid-cols-3'} gap-3 pt-4 border-t border-white/5 relative">
                                    ${isTemp ? `
                                        <button onclick="completeDocument(${doc.id})" class="col-span-2 relative overflow-hidden group/btn rounded-lg">
                                            <div class="absolute inset-0 bg-gold-plate"></div>
                                            <div class="absolute inset-0 bg-white/20 opacity-0 group-hover/btn:opacity-100 transition-opacity"></div>
                                            <div class="relative py-2.5 flex items-center justify-center gap-2 text-black font-bold text-xs tracking-wide">
                                                <span class="material-icons-round text-sm">check_circle</span>
                                                <span>完成</span>
                                            </div>
                                        </button>
                                    ` : ''}
                                    <button onclick="editDocument(${doc.id})" class="col-span-1 py-2.5 bg-[#222] hover:bg-[#2a2a2a] text-glam-gold-300 border border-white/10 hover:border-glam-gold-500/30 rounded-lg flex items-center justify-center transition-all">
                                        <span class="material-icons-round text-lg">edit</span>
                                    </button>
                                    <button onclick="deleteDocument(${doc.id})" class="col-span-1 py-2.5 bg-[#222] hover:bg-red-900/20 text-gray-500 hover:text-red-400 border border-white/10 hover:border-red-500/30 rounded-lg flex items-center justify-center transition-all">
                                        <span class="material-icons-round text-lg">delete</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // ========== 篩選功能 ==========
        function setFilter(filter) {
            currentFilter = filter;
            
            // 更新按鈕樣式
            ['all', 'temp', 'complete'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'flex-shrink-0 px-4 py-2 bg-gradient-to-r from-glam-gold-500 to-glam-gold-700 text-black font-bold text-xs rounded-lg shadow-[0_4px_12px_rgba(212,175,55,0.3)] border border-glam-gold-300/50 flex items-center gap-1';
                } else {
                    btn.className = 'flex-shrink-0 px-4 py-2 bg-white/5 text-gray-400 border border-white/10 hover:border-glam-gold-500/50 rounded-lg text-xs font-medium tracking-wide transition-all hover:bg-white/10';
                }
            });

            renderDocuments();
        }

        function filterDocuments() {
            renderDocuments();
        }

        // ========== 統計功能 ==========
        function updateStats() {
            const total = documents.length;
            const complete = documents.filter(d => d.status === 'complete').length;
            const temp = documents.filter(d => d.status === 'temp').length;
            const today = new Date().toDateString();
            const todayCount = documents.filter(d => 
                new Date(d.date).toDateString() === today
            ).length;

            document.getElementById('tempCount').textContent = temp;
            document.getElementById('totalCountDisplay').textContent = total;
            document.getElementById('completeCountDisplay').textContent = complete;
            document.getElementById('tempCountDisplay').textContent = temp;
            document.getElementById('todayCountDisplay').textContent = todayCount;
        }

        function showStats() {
            const statsPanel = document.getElementById('statsPanel');
            statsPanel.classList.toggle('hidden');
        }

        // ========== 資料儲存與載入 ==========
        function saveDocuments() {
            localStorage.setItem('documents', JSON.stringify(documents));
        }

        function loadDocuments() {
            const saved = localStorage.getItem('documents');
            if (saved) {
                documents = JSON.parse(saved);
            }
        }

        // ========== CSV 匯出 ==========
        function exportToCSV() {
            if (documents.length === 0) {
                showToast('目前沒有資料可以匯出', 'warning');
                return;
            }

            const headers = ['文號', '公司代碼', '部門代碼', '狀態', '主旨', '受文者', '建立日期'];
            const rows = documents.map(doc => [
                doc.docNumber,
                doc.companyCode,
                doc.deptCode,
                doc.status === 'temp' ? '臨時號碼' : '已完成',
                doc.subject || '',
                doc.recipient || '',
                new Date(doc.date).toLocaleString('zh-TW')
            ]);

            let csvContent = '\uFEFF';
            csvContent += headers.join(',') + '\n';
            csvContent += rows.map(row => 
                row.map(cell => `"${cell}"`).join(',')
            ).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `發文管理系統_${new Date().toISOString().split('T')[0]}.csv`);
            link.click();

            showToast('📊 CSV 檔案已下載');
            closeSettingsModal();
        }

        // ========== 清空資料 ==========
        function confirmClearAll() {
            if (!confirm('⚠️ 確定要清空所有資料嗎？此操作無法復原！')) return;
            if (!confirm('⚠️ 最後確認：真的要刪除所有文號資料嗎？')) return;

            documents = [];
            saveDocuments();
            renderDocuments();
            updateStats();
            closeSettingsModal();
            showToast('🗑️ 已清空所有資料');
        }

        // ========== Toast 通知 ==========
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
